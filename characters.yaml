- 'excluded row ''Robert'' -> ''Saint-Loup'': bare first name; unsafe as a global rewrite
  — reference only'
- 'excluded row ''Charles'' -> ''Swann'': bare first name; collides with Charlie/Charlus contexts
  — reference only'
- 'excluded row ''Charlie'' -> ''Morel'': bare first name; reference only'
