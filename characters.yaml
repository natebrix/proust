version: 1
generated_by: scripts/build_character_registry.py
notes: 'Single source of truth for character identity. Layers merged: root aliases.csv, per-run
  alias maps, annotation usage, plus a hand-authored overlay. status=proposed/review entries
  and all review_questions await Nathan''s decision. Scope grammar and safety rules: see proust/registry.py
  docstring. Ruling 2026-08-11: family-possessive surface forms (ma grand''mère, maman, mon
  père, etc.) are resolution-only knowledge — scope mention_only, rewrite never, scan false;
  never scan evidence, never a rewrite target. Ruling 2026-08-11 (registry-audit v2 candidates):
  absorbed 30 recurring named characters from outputs/character-registry-audit-v2.md section E
  (count>=8, plus M. d''Argencourt confirmed via A/B) as status=proposed entities, plus surface
  forms attached to seven already-existing entities; see individual entity notes for
  consolidations, the Cambremer dowager ambiguity, and the Froberville colonel/général
  review:true case.'
